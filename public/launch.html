<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fefdf8" />
    <meta name="color-scheme" content="light" />
    <title>Numletics</title>
    <style>
      /* The manifest's start_url. The service worker serves it from the cache, so it paints right away
         while "/" waits on the server (session refresh, cold start). Values copy the tokens in app/globals.css. */
      :root {
        --canvas: #fefdf8;
        --ink: #0f1216;
        --line: #e5e5e6;
        --accent: #bef62e;
      }
      html { background: var(--canvas); }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        background: var(--canvas);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .logo { display: inline-flex; align-items: center; gap: 12px; }
      .logo svg { width: 32px; height: 32px; }
      .logo span { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
      .bar {
        width: 96px;
        height: 4px;
        overflow: hidden;
        border-radius: 9999px;
        background: var(--line);
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: var(--ink);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after { animation: none; width: 100%; opacity: 0.3; }
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect x="0" y="7" width="11" height="25" rx="2" fill="var(--accent)" />
        <path d="M1 0h9l11 16V0h10v28h-8L11 10 1 3V0Z" fill="var(--ink)" />
      </svg>
      <span>Numletics</span>
    </div>
    <div class="bar" role="status" aria-label="Loading"></div>
    <script>
      // The browser keeps this page painted until "/" starts rendering, so there's no blank gap.
      location.replace("/");
    </script>
  </body>
</html>
